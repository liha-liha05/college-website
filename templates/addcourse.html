<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">

    <div class="logo">
        <h2>ABC College</h2>
        <p>Admin Dashboard</p>
    </div>

    <ul>
        <li><a href="/adminhome"><i class="fas fa-home"></i> Home</a></li>
        <li class="active"><a href="/addcourse"><i class="fas fa-book"></i> Add Courses</a></li>
        <li><a href="/viewcourse"><i class="fas fa-list"></i> View Courses</a></li>
        <li><a href="/admissions"><i class="fas fa-user-graduate"></i> Admissions</a></li>
        <li><a href="/results"><i class="fas fa-poll"></i> Results</a></li>
        <li><a href="/reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
         <li><a href="/adminlogin">🚪 back to home</a></li>
    </ul>

</div>

<!-- Main Content -->
<div class="main">

    <div class="topbar">
        <h2>Add New Course</h2>
        <div class="profile">
            Welcome Admin
        </div>
    </div>

    <div class="form-container">

        <form action="/addcourse" method="POST">

            <div class="row">

                <div class="input-group">
                    <label>Course ID</label>
                    <input type="text" name="courseid" placeholder="CSE101" required>
                </div>

                <div class="input-group">
                    <label>Course Name</label>
                    <input type="text" name="coursename" placeholder="Computer Science Engineering" required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Department</label>

                    <select name="department">

                        <option>Select Department</option>
                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>MECH</option>
                        <option>CIVIL</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Duration</label>

                    <input type="text" name="duration" placeholder="4 Years">

                </div>

            </div>

            <div class="row">

                <div class="input-group">

                    <label>Course Fee</label>

                    <input type="number" name="fee" placeholder="50000">

                </div>

                <div class="input-group">

                    <label>Seats Available</label>

                    <input type="number" name="seats" placeholder="60">

                </div>

            </div>

            <div class="row">

                <div class="input-group">

                    <label>Course Description</label>

                    <textarea name="description" rows="5" placeholder="Enter Course Description"></textarea>

                </div>

            </div>

            <button type="submit" class="btn">
                <i class="fas fa-plus-circle"></i> Add Course
            </button>

        </form>

    </div>

</div>

</body>
</html>
